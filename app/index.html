<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7eb">
  <title>掌中影戏 · 小兔摘月</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game" class="game is-loading" aria-label="掌中影戏，第一关小兔摘月">
    <header class="heading">
      <div class="eyebrow"><span class="line"></span>掌中影戏<span class="seal">第一幕</span><span class="line"></span></div>
      <h1>小兔摘月</h1>
      <p id="goal">让兔影碰到月亮</p>
    </header>
    <section class="stage" aria-label="皮影戏舞台">
      <svg id="scene" viewBox="0 0 390 420" role="img" aria-labelledby="scene-title" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <title id="scene-title">小兔举起手，等待你用灯光帮助它够到月亮</title>
        <defs>
          <radialGradient id="moonLight"><stop offset="0" stop-color="#fffbd5" stop-opacity=".9"/><stop offset=".5" stop-color="#ffdc81" stop-opacity=".4"/><stop offset="1" stop-color="#ffda84" stop-opacity="0"/></radialGradient>
        </defs>
        <g id="moon-group">
          <circle id="moon-glow" cx="272" cy="116" r="60" fill="url(#moonLight)" opacity=".2"/>
          <image x="244" y="88" width="56" height="56" xlink:href="./art/moon.webp"/>
          <circle id="contact-ring" cx="272" cy="116" r="30" fill="none" stroke="#e4b14c" stroke-width="1.5" opacity="0"/>
        </g>
        <image id="projection" x="86.4" y="215" width="141.2" height="190" opacity=".94" xlink:href="./art/rabbit.webp"/>
        <g id="sparkles" fill="#d99537" opacity="0" aria-hidden="true">
          <path d="M0-4 1-1 4 0 1 1 0 4-1 1-4 0-1-1Z" transform="translate(239 107)"/>
          <path d="M0-3 1-1 3 0 1 1 0 3-1 1-3 0-1-1Z" transform="translate(304 93)"/>
          <path d="M0-4 1-1 4 0 1 1 0 4-1 1-4 0-1-1Z" transform="translate(263 76)"/>
          <circle cx="290" cy="151" r="1.5"/><circle cx="238" cy="138" r="1.5"/><circle cx="300" cy="129" r="1"/>
        </g>
      </svg>
      <div id="loading" class="loading" role="status"><span class="loading-lamp">✧</span><p id="loading-text">正在点亮戏台…</p><button id="retry" type="button" hidden>重新点灯</button></div>
      <div id="curtain-caption" class="curtain-caption" aria-hidden="true">一束光，一场小小的圆满。</div>
    </section>
    <section id="workbench" class="workbench" aria-label="幕后操作台">
      <p id="guide" class="guide" role="status" aria-live="polite">把灯推近，小兔的影子会变大。</p>
      <div id="tray" class="tray">
        <div class="tray-top"><span>幕后小机关</span><span class="tray-note">拖动灯座，试试看</span></div>
        <div class="beam" aria-hidden="true"></div>
        <div class="rail" aria-hidden="true"><span></span></div>
        <div class="puppet"><span class="object-label">皮影</span><img src="./art/rabbit.webp" alt="固定举手姿态的皮影木偶" draggable="false"><i></i></div>
        <div class="screen-edge" aria-hidden="true"><span class="object-label">影幕</span><i></i></div>
        <div id="lamp" class="lamp" role="slider" tabindex="0" aria-label="灯的位置，向右推近皮影，影子变大" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="灯在远处" aria-describedby="guide">
          <span class="object-label">灯</span>
          <span class="lamp-halo" aria-hidden="true"></span>
          <img src="./art/lamp.webp" alt="" draggable="false">
          <span class="grip-ring" aria-hidden="true"></span>
        </div>
        <span id="drag-arrow" class="drag-arrow" aria-hidden="true">⟶</span>
      </div>
    </section>
    <footer class="footer">
      <div id="play-actions" class="actions">
        <button id="reset" class="button button-red" type="button" disabled><span class="button-icon">↶</span>重来</button>
        <button id="hint" class="button button-green" type="button" disabled><span class="button-icon">✧</span>提示</button>
      </div>
      <div id="success-actions" class="actions" hidden>
        <button id="replay" class="button button-red" type="button">再演一次</button>
        <button id="admire" class="button button-green" type="button">赏月</button>
      </div>
      <div id="admire-actions" class="actions" hidden><button id="back" class="button button-green" type="button">返回戏台</button></div>
      <p id="footer-note" class="footer-note">一束光 · 一台戏</p>
    </footer>
    <noscript><p class="noscript">请启用 JavaScript，让小兔的影子动起来。</p></noscript>
  </main>
  <script src="./logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
